name: Frame voice connectivity check
on:
  push:
    branches: [codex/frame-voice-cross-network-check]
permissions:
  contents: read
jobs:
  automatic-voice:
    name: Automatic voice fallback in two browsers
    timeout-minutes: 7
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify audio with an interrupted standard connection
        run: |
          node .github/test-voice.cjs host &
          host_pid=$!
          node .github/test-voice.cjs guest &
          guest_pid=$!
          trap 'kill "$host_pid" "$guest_pid" 2>/dev/null || true' EXIT
          host_status=0
          guest_status=0
          wait "$host_pid" || host_status=$?
          wait "$guest_pid" || guest_status=$?
          test "$host_status" = 0 && test "$guest_status" = 0
