name: Frame desktop voice and seeking check
on:
  push:
    branches: [codex/frame-voice-seek-check]
permissions:
  contents: read
jobs:
  voice-and-seek:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify audio sharing and seek permissions
        run: node .github/test-desktop-voice-seek.cjs
