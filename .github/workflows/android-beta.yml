name: Android beta APK

on:
  push:
    branches: [android-screen-beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check live Android sign-in
        run: |
          origin=https://erev.pages.dev
          proof=$(printf '%043d' 0)
          curl --retry 2 -fsS "$origin/auth/android?challenge=$proof" | grep -q "Continue with Google"
          curl --retry 2 -fsS "$origin/beta-invite.js" | grep -q "android-exchange"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Origin: $origin" --data "code=$proof" "$origin/auth/android/exchange")
          test "$status" = 400
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: erev-android-beta
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
