name: Android beta APK

on:
  push:
    branches: [android-screen-beta]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check live Android sign-in
        run: |
          origin=https://erev.pages.dev
          proof=$(printf '%043d' 0)
          curl --retry 2 -fsS "$origin/auth/android?challenge=$proof" | grep -q "Continue with Google"
          curl --retry 2 -fsS "$origin/beta-invite.js" | grep -q "android-exchange"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Origin: $origin" --data "code=$proof" "$origin/auth/android/exchange")
          test "$status" = 400
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: erev-android-beta
          path: verify-apk
          run-id: 46018127849
          github-token: ${{ github.token }}
      - name: Prepare the published APK and Android smoke test
        run: |
          set -euo pipefail
          runner_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          platform="$runner_sdk/platforms/android-35/android.jar"
          build_tools="$(find "$runner_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p verify-apk/classes verify-apk/dex
          javac --release 17 -cp "$platform" -d verify-apk/classes android/app/src/androidTest/java/app/erev/mobile/MicSmoke.java
          jar --create --file verify-apk/test.jar -C verify-apk/classes .
          "$build_tools/d8" --lib "$platform" --min-api 26 --output verify-apk/dex verify-apk/test.jar
          cat > verify-apk/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="app.erev.mobile.test">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35"/>
            <application android:debuggable="true"/>
            <instrumentation android:name="app.erev.mobile.MicSmoke" android:targetPackage="app.erev.mobile"/>
          </manifest>
          XML
          "$build_tools/aapt" package -f -M verify-apk/AndroidManifest.xml -I "$platform" -F verify-apk/test-unsigned.apk
          (cd verify-apk/dex && zip -q ../test-unsigned.apk classes.dex)
          "$build_tools/zipalign" -f 4 verify-apk/test-unsigned.apk verify-apk/test-aligned.apk
          keytool -genkeypair -keystore verify-apk/test.jks -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -dname CN=ErevSmokeTest -validity 1
          for entry in app-debug test-aligned; do
            "$build_tools/apksigner" sign --ks verify-apk/test.jks --ks-pass pass:android --out "verify-apk/$entry-signed.apk" "verify-apk/$entry.apk"
            "$build_tools/apksigner" verify "verify-apk/$entry-signed.apk"
          done
      - name: Test microphone capture and audio delivery on Android
        timeout-minutes: 12
        run: |
          set -euo pipefail
          runner_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdk_adb="$runner_sdk/platform-tools/adb"
          "$sdk_adb" start-server
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/erev-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          system_image="system-images;android-35;google_apis;x86_64"
          sdk_tools="$runner_sdk/cmdline-tools/latest/bin"
          if [[ ! -x "$sdk_tools/sdkmanager" ]]; then
            sdk_tools="$(dirname "$(find "$runner_sdk/cmdline-tools" -name sdkmanager | sort -V | tail -1)")"
          fi
          "$sdk_tools/sdkmanager" "$system_image"
          printf 'no\n' | "$sdk_tools/avdmanager" create avd --force --name erev-mic --package "$system_image" --path "$ANDROID_AVD_HOME/erev-mic.avd"
          "$runner_sdk/emulator/emulator" -list-avds | grep -Fx erev-mic
          "$runner_sdk/emulator/emulator" -avd erev-mic -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect > /tmp/erev-emulator.log 2>&1 &
          emulator_pid=$!
          booted=
          for attempt in {1..36}; do
            if [[ "$(timeout 6 "$sdk_adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]]; then
              booted=yes
              break
            fi
            kill -0 "$emulator_pid" 2>/dev/null || break
            sleep 3
          done
          if [[ "$booted" != yes ]]; then
            "$sdk_adb" devices -l
            cat /tmp/erev-emulator.log
            exit 1
          fi
          "$sdk_adb" shell input keyevent KEYCODE_WAKEUP
          "$sdk_adb" shell wm dismiss-keyguard
          "$sdk_adb" install -g verify-apk/app-debug-signed.apk
          "$sdk_adb" install verify-apk/test-aligned-signed.apk
          result=$(timeout 80 "$sdk_adb" shell am instrument -w app.erev.mobile.test/app.erev.mobile.MicSmoke)
          echo "$result"
          if ! grep -q 'result=mic-and-rtp-ok' <<< "$result"; then
            "$sdk_adb" logcat -d -s chromium AndroidRuntime AudioManagerAndroid
            exit 1
          fi
