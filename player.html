<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame | Local video</title><link rel="stylesheet" href="style.css"></head><body><header><span class="brand">frame<span class="accent">.</span></span><span>Local player</span></header><main style="width:min(1100px,100%);padding:20px;margin:auto"><h2>Choose a movie</h2><p class="small">Open this tab in Frame's screen sharing picker and enable tab audio. Your file never uploads.</p><input type="file" id="file" accept="video/*"><video id="v" controls playsinline style="width:100%;max-height:75vh;margin-top:16px;background:#080a08;border-radius:12px"></video><p id="error" role="status" class="small"></p></main><script>let url;const v=document.getElementById('v');document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;v.play().catch(()=>{});};v.onerror=()=>document.getElementById('error').textContent='This format may not be supported by your browser.';</script></body></html>
