plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'app.erev.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.erev.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
